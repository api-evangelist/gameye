  update:
    x-apievangelist-enriched: '2026-07-19'
    x-apievangelist-provider: gameye
    x-apievangelist-category: game-server-orchestration
- target: $.info
  update:
    x-artifacts:
      authentication: authentication/gameye-authentication.yml
      errors: errors/gameye-problem-types.yml
