problems:
- status: 401
  code: UNAUTHORIZED
  title: Unauthorized
  meaning: Missing, malformed, or invalid API token.
  remediation: "Verify the 'Authorization: Bearer <token>' header is present and correct."
- status: 402
  code: QUOTA_EXCEEDED
  title: Quota exhausted
  meaning: Your allocated session quota / trial runtime minutes are exhausted.
  remediation: Contact Gameye support to renew or increase your quota.
