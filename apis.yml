aid: gameye
name: Gameye
description: >-
  Gameye is a managed game server orchestration platform for multiplayer game
  studios, founded in 2017 in Rotterdam (Gameye B.V.). It runs dedicated,
  containerized game servers across bare metal, cloud, and edge providers behind
  a single REST API — the Session API. Studios call POST /session with a region
  and a Docker image; Gameye selects the best available location, starts a
  container in about half a second, and returns the host IP and mapped ports
  players connect to. Capacity-based pricing carries no egress fees, and the
  platform is matchmaker-agnostic (Pragma Engine, Nakama, PlayFab, FlexMatch).
  Gameye has orchestrated 120M+ sessions with a 99.99% uptime SLA and serves
  studios including Torn Banner Studios (Chivalry 2) and Remedy Entertainment.
